[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memescript"
version = "0.1.0"
description = "Automated meme generation from video scripts — Fireship-style contextual meme insertion"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "anthropic>=0.39.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
memescript = "memescript.cli:main"

[tool.setuptools.packages.find]
include = ["memescript*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
