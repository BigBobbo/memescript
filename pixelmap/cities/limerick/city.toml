# Limerick — city configuration
# Everything city-specific lives in this folder. The pixelmap pipeline itself
# never branches on city name.

[city]
name        = "Limerick"
name_local  = "Luimneach"
slug        = "limerick"
country     = "Ireland"
crs         = "EPSG:2157"      # IRENET95 / Irish Transverse Mercator (metres)
seed        = 2157

[bbox]
# Fetch window (WGS84). Wider than the render window so the crop can move
# without re-fetching. ~4.4 x 4.1 km around the city core.
south = 52.645
west  = -8.660
north = 52.685
east  = -8.600

[projection]
# Rotation applied before isometric projection, in degrees.
# Positive = rotate the map counter-clockwise on screen.
#
# Grid alignment comes first: the value must stay in the family -32.75 + 45k,
# which minimises the length-weighted bend needed to snap streets onto the eight
# directions that render as clean pixel lines. Measured over the 179 streets of
# the Georgian core (14.5 km):
#
#   rotation           core bend   core crisp   city crisp
#   none                 11.95°       12.0%        17.5%
#   -32.75 + 45k          6.18°       58.1%        26.2%
#
# The whole fetch area has almost no dominant grid (4-fold strength 0.03), so
# its own "optimum" of -25.9° is a shallow noise minimum that would cut the
# core's crisp share to 19%. The core wins.
#
# Composition brief (M1b): Shannon low and horizontal, west on the right, the
# old city above the water. That fixes screen-right near west; 192.25 puts it at
# WSW (237°), which lands the in-frame river (axis 51.1°) 6.1° off horizontal and
# Dock Road (58.7°) 1.4° off — both effectively level.
#
# TRADE-OFF, deliberate and reversible. Crisp directions in 2:1 isometric repeat
# every 45°, alternating between two families: even multiples put building
# footprints on the iso diagonals (two visible walls, the classic look), odd
# multiples put them on the screen axes (flatter, more plan-like). The river runs
# ~19.5° off the Georgian grid, so a level river forces the odd family. Bend cost
# is unaffected — still 6.18° — only the building silhouettes change.
# To recover both: straighten the river in the schematize stage and return to the
# 237.25 family. See M1-FINDINGS.md.
rotation_deg = 212.75
rotation_source = "m2: bend-optimal family 32.75+90k, member with west on the right and the grid on the 2:1 diagonals"

[grid]
# Ground cell size in metres. A cell renders as a 4x2 px rhombus.
# Dropped to hold the facade pixel budget once height exaggeration was removed:
# true height halves a wall, so resolution has to make it back. At 0.3 m an 8 m
# frontage spans ~60 px and a 2-storey wall ~43 px — about 2,550 px of facade,
# against 3,150 at the stretched 0.4 m setting and 1,440 unstretched.
cell_m = 0.3

[print]
# NOT BINDING while iterating on composition and scale — kept as the eventual
# framing target. At Pixorama scale the canvas is set by [frame] and [grid].
width_cm  = 91.44
height_cm = 60.96
dpi       = 300

[render]
# Height is expressed as a multiple of true isometric rather than in pixels, so
# it stays correct when the cell size changes. True is 2 px per cell of height.
# Kept at true isometric. Stretching buildings vertically buys clearance between
# rows but distorts the architecture; widening the streets (see [schematize])
# buys the same clearance honestly. At true height a 2-storey row needs only
# 6.4 m of clear ground behind it, against 14.1 m at the 2.2 we tried.
height_exaggeration = 1.0
default_levels = 2             # empirical Limerick default (83% of tagged = 2)

[frame]
# The ground rectangle in shot, so detail level and coverage stay independent.
# Shows the Shannon along the bottom with King John's Castle and King's Island
# at the lower left, the Georgian core filling the frame, and Sarsfield Bridge,
# Shannon Bridge and Riverpoint running away to the west on the right.
across_m = 1850
deep_m   = 1200
anchor   = { lat = 52.6683, lon = -8.6274 }

# How much more ground to take in, at the same pixels per metre and the same
# aspect. Coverage and detail are separate knobs on purpose: `scale` grows the
# canvas around the subject, `cell_m` changes how finely it is drawn.
#
# 1.55 is the smallest value that takes in everything asked for — Ted Russell
# Dock and the dock road (needs 1.52), Colbert (1.09), People's Park (1.17),
# King John's Castle and Thomond Bridge (0.97) — with a little air around the
# tightest of them. The full Limerick Docks landuse tails another 700 m west
# and would need 1.90, which reaches outside the fetched bbox; the wet dock
# itself is the part worth drawing.
scale = 1.55

# The river is placed by a real mid-channel point rather than by its centroid:
# Overpass returns whole river polygons spanning 18 km, so the centroid sits far
# outside the frame and is useless as a reference.
river_ref   = { lat = 52.66508, lon = -8.62972, note = "mid-channel, Sarsfield Bridge" }
river_depth = 0.56              # 0 = top of canvas, 1 = bottom

# West Limerick is out of scope for now, Thomond Park included.
exclude = ["Thomond Park"]

[schematize]
# How hard geometry is simplified before it is snapped onto the eight crisp
# directions. Roads keep their shape; water is simplified hard so the Shannon
# becomes a few long deliberate reaches rather than a snapped staircase.
road_simplify_m  = 8.0
water_simplify_m = 45.0

# Buildings are pushed this far back from the street they front, widening every
# street by twice this. Replaces height exaggeration as the way to keep facades
# clear of the row in front — a long-standing liberty in isometric city art.
street_widen_m = 3.5

[lidar]
# Open LiDAR heights. OSM gives Limerick almost no heights — 6% of footprints
# carry building:levels and none carry height — so without this the whole city
# renders at the 2-storey default and the skyline is flat.
#
# The OPW National Aerial Survey Contract set covers the entire fetch window in
# nine 2 km tiles at 2 m, flown 2011. The newer 1 m GSI surveys do not reach
# the city centre; 2 m is the best that exists here, and at 2 m a 6 m terrace is
# three pixels across — enough for a storey-accurate answer, not for detail.
service = "https://gsi.geodata.gov.ie/server/rest/services/Lidar/IE_GSI_LiDAR_Coverage_OPW_NASC_IE26_ITM/MapServer/3"
srid    = 2157
attribution = "Contains Irish Public Sector Data (Geological Survey Ireland & the Office of Public Works) licensed under a Creative Commons Attribution 4.0 International (CC BY 4.0) licence."

# Sampling. The renderer wants the EAVE, but a low percentile does not measure
# it at 2 m: a pixel on the outline averages roof with pavement, so the low end
# of the spread is contamination rather than eaves. Swept against the tagged
# buildings, the 20th percentile correlates at r=0.60 and implies an impossible
# 2.0 m storey, the 85th at r=0.76 and a believable 2.9 m. The eave is recovered
# from this reading by the fitted calibration instead — see lidar.py.
roof_percentile  = 85.0
ridge_percentile = 97.0

# Erosion is off. Edge pixels only ever read low, so the high percentile above
# already ignores them, and shrinking a three-pixel terrace costs more samples
# than the contamination does (r=0.763 unroded against 0.749 at 1 m).
erode_m = 0.0

# Calibration is fitted per city rather than configured, so a second city does
# not need its storey height hand-tuned. Towers are excluded from the fit and
# left to be predicted: mappers tag the tall, and a handful of 15-storey
# outliers would otherwise lever the line that 3,000 terraces depend on.
calibration_max_levels  = 6.0
calibration_min_samples = 100

# Below this, a reading is pavement bleed, a demolished building, or one built
# after the 2011 survey. Such buildings keep their tag or the default rather
# than being flattened.
min_height_m = 2.0
min_pixels   = 1
