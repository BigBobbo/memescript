# Limerick — city configuration
# Everything city-specific lives in this folder. The pixelmap pipeline itself
# never branches on city name.

[city]
name        = "Limerick"
name_local  = "Luimneach"
slug        = "limerick"
country     = "Ireland"
crs         = "EPSG:2157"      # IRENET95 / Irish Transverse Mercator (metres)
seed        = 2157

[bbox]
# Fetch window (WGS84). Wider than the render window so the crop can move
# without re-fetching. ~4.4 x 4.1 km around the city core.
south = 52.645
west  = -8.660
north = 52.685
east  = -8.600

[projection]
# Rotation applied before isometric projection, in degrees.
# Positive = rotate the map counter-clockwise on screen.
#
# Grid alignment comes first: the value must stay in the family -32.75 + 45k,
# which minimises the length-weighted bend needed to snap streets onto the eight
# directions that render as clean pixel lines. Measured over the 179 streets of
# the Georgian core (14.5 km):
#
#   rotation           core bend   core crisp   city crisp
#   none                 11.95°       12.0%        17.5%
#   -32.75 + 45k          6.18°       58.1%        26.2%
#
# The whole fetch area has almost no dominant grid (4-fold strength 0.03), so
# its own "optimum" of -25.9° is a shallow noise minimum that would cut the
# core's crisp share to 19%. The core wins.
#
# Composition brief (M1b): Shannon low and horizontal, west on the right, the
# old city above the water. That fixes screen-right near west; 192.25 puts it at
# WSW (237°), which lands the in-frame river (axis 51.1°) 6.1° off horizontal and
# Dock Road (58.7°) 1.4° off — both effectively level.
#
# TRADE-OFF, deliberate and reversible. Crisp directions in 2:1 isometric repeat
# every 45°, alternating between two families: even multiples put building
# footprints on the iso diagonals (two visible walls, the classic look), odd
# multiples put them on the screen axes (flatter, more plan-like). The river runs
# ~19.5° off the Georgian grid, so a level river forces the odd family. Bend cost
# is unaffected — still 6.18° — only the building silhouettes change.
# To recover both: straighten the river in the schematize stage and return to the
# 237.25 family. See M1-FINDINGS.md.
rotation_deg = 212.75
rotation_source = "m2: bend-optimal family 32.75+90k, member with west on the right and the grid on the 2:1 diagonals"

[grid]
# Ground cell size in metres. A cell renders as a 4x2 px rhombus.
# Pixorama scale: an 8 m house frontage is 53 px wide and a 2-storey house is
# 27 px tall — enough room for windows, doors and chimneys. Canvas size follows
# from this and the frame extents (8250 x 2594 px), rather than being fixed.
cell_m = 0.6

[print]
# NOT BINDING while iterating on composition and scale — kept as the eventual
# framing target. At Pixorama scale the canvas is set by [frame] and [grid].
width_cm  = 91.44
height_cm = 60.96
dpi       = 300

[render]
# Height is expressed as a multiple of true isometric rather than in pixels, so
# it stays correct when the cell size changes. True is 2 px per cell of height;
# 1.27 makes terraces read as rows of houses rather than slabs (M1 study).
height_exaggeration = 1.27
default_levels = 2             # empirical Limerick default (83% of tagged = 2)

[frame]
# The ground rectangle in shot, so detail level and coverage stay independent.
# Shows the Shannon along the bottom with King John's Castle and King's Island
# at the lower left, the Georgian core filling the frame, and Sarsfield Bridge,
# Shannon Bridge and Riverpoint running away to the west on the right.
across_m = 1850
deep_m   = 1200
anchor   = { lat = 52.6683, lon = -8.6274 }

# The river is placed by a real mid-channel point rather than by its centroid:
# Overpass returns whole river polygons spanning 18 km, so the centroid sits far
# outside the frame and is useless as a reference.
river_ref   = { lat = 52.66508, lon = -8.62972, note = "mid-channel, Sarsfield Bridge" }
river_depth = 0.56              # 0 = top of canvas, 1 = bottom

# West Limerick is out of scope for now, Thomond Park included.
exclude = ["Thomond Park"]

[schematize]
# How hard geometry is simplified before it is snapped onto the eight crisp
# directions. Roads keep their shape; water is simplified hard so the Shannon
# becomes a few long deliberate reaches rather than a snapped staircase.
road_simplify_m  = 8.0
water_simplify_m = 45.0
